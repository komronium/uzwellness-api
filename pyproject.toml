[project]
name = "uzwellness-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.136.1",
    "bcrypt>=5.0.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.0",
    "pillow>=12.0.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.27",
    "redis>=7.4.0",
    "reportlab>=4.0.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "aiofiles>=25.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-n auto"

[tool.pyright]
# Zed and the CLI both read this. Without it basedpyright runs in its
# "recommended" mode, which reports several thousand diagnostics that are the
# checker disagreeing with SQLAlchemy and FastAPI rather than anything wrong:
# `Depends()` in a parameter default, `__tablename__` without an annotation,
# and every value that reaches us through SQLAlchemy's untyped surface.
include = ["app", "tests", "scripts"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

# The declarative Base has no typed `id`/`slug`, so generic helpers that take a
# model class read as attribute errors on `type[Base]`.
reportAttributeAccessIssue = "warning"
# pydantic-settings fills required fields from the environment, which looks
# like a constructor called with no arguments.
reportCallIssue = "warning"

# Tests hand-build lightweight stand-ins (a class with three attributes where
# the signature says `Sanatorium`) to exercise pure functions without touching
# the database. That is the point of them, so structural mismatches there are
# not findings.
[[tool.pyright.executionEnvironments]]
root = "tests"
# An execution environment also resets the import root, so the project root has
# to be handed back or every `from app...` in a test reads as unresolved.
extraPaths = ["."]
reportArgumentType = "none"
reportOptionalMemberAccess = "none"

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["."]
